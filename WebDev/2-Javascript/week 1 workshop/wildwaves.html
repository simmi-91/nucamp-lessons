<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Wild Waves Aquatic Park</title>

</head>
<body>
    <h1>Wild Waves Aquatic Park</h1>
    <button type="button" onclick="buyTicket()">Purchase Attraction</button>

    <script>
    	const WAVE_POOL_MIN_HEIGHT = 42; // in inches
    	const WATERSLIDE_MIN_HEIGHT = 48; // in inches
    	const LAZY_RIVER_MIN_HEIGHT = 36; // in inches

        function buyTicket() {
            const attractionType = prompt('Which attraction do you want to visit: type "wave" for wave pool, "water" for waterslide, or "river" for lazy river?');
            const userHeight = prompt('What is your height in inches?');
            const withAdult = prompt('Are you in company of an adult?');

            const formattedAttractionType = attractionType.trim().toLowerCase();
            const formattedUserHeight = parseInt(userHeight.trim());
            const formattedWithAdult = withAdult.trim().toLowerCase();
            
            console.log("User's selected attraction is " + formattedAttractionType);
            console.log("User's height is " + formattedUserHeight);
            
            const boolAdult = checkAdult(formattedWithAdult);
            console.log(boolAdult ? 'User brought adult.' : 'No adult present.');

            const isAllowed = checkHeight(formattedAttractionType, formattedUserHeight, boolAdult);
            alert(isAllowed ? 'You are allowed to enter the ' + formattedAttractionType + ' attraction!' : 'Sorry, you do not meet the height requirement for the ' + formattedAttractionType + ' attraction.');
        }

        function checkAdult(withAdult) {
            if ((withAdult === 'yes') || (withAdult === 'y')) {
                return true;
            }
            return false;
        }
        function checkHeight(attraction, height, boolAdult) {            
            if ( boolAdult === true && height > 42) {
                return true;
            }

            if ( attraction === 'wave') {
                return (height >= WAVE_POOL_MIN_HEIGHT);
            }
            else if ( attraction === 'water') {
                return (height >= WATERSLIDE_MIN_HEIGHT);
            }
            else if ( attraction === 'river') {
                return (height >= LAZY_RIVER_MIN_HEIGHT);
            }
            else {
                alert('Invalid attraction type selected.');
                return false;
            }
        }
        
    </script>
</body>
</html>
